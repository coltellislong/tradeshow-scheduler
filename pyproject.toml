[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tradeshow-scheduler"
version = "0.1.0"
description = "CLI tool to track upcoming tradeshows and their needs"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
tradeshow = "tradeshow_scheduler.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
